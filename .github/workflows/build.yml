name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5

      - name: Decode Keystore
        run: |
          echo "Using repository keystore - skipping decode"

      - name: Print KEYSTORE_BASE64 (TEMPORARY)
        run: |
          echo "================ KEYSTORE_BASE64 ================"
          base64 -w 0 android/app/release.keystore || base64 android/app/release.keystore | tr -d '\n'
          echo ""
          echo "================================================="

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release.keystore" >> android/key.properties

          echo "----- key.properties -----"
          cat android/key.properties

      - name: Get Packages
        run: flutter pub get

      - name: Patch Isar Android plugin
        run: |
          FILE="$HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-3.1.0+1/android/build.gradle"

          sed -i '/android {/a\    namespace "dev.isar.isar_flutter_libs"' "$FILE"
          sed -i 's/compileSdkVersion 30/compileSdkVersion 36/' "$FILE"

      - name: Generate Isar Files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Show APK Certificate
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk